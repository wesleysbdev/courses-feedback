quarkus:
  http:
    port: 8081

  rest-client:
    feedback-api:
      url: ${FEEDBACK_API_URL:http://localhost:8080}
      scope: jakarta.inject.Singleton

  redis:
    hosts: ${REDIS_HOST:redis://localhost:6379}
    password: ${REDIS_PASSWORD}
    tls:
      enabled: ${REDIS_TLS_ENABLED:false}
      hostname-verification-algorithm: HTTPS

app:
  security:
    internal-token: ${INTERNAL_SERVICE_TOKEN}
    maximo-dias-relatorio: 30