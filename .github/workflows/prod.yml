
name: Deploy Application Courses Feedback

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '25'

      - name: Build project
        run: mvn clean install -DskipTests

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build \
            -t inovahfiap/courses_feedback:latest \
            -t inovahfiap/courses_feedback:${{ github.sha }} \
            ./feedback-api

      - name: Push Docker image
        run: |
          docker push inovahfiap/courses_feedback:latest
          docker push inovahfiap/courses_feedback:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        run: echo "Deploy SSH será configurado na próxima etapa."
